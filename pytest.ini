[pytest]
testpaths = tests
base_url = https://www.saucedemo.com
addopts =
    -n auto
    --dist=loadscope
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
    --output=test-results
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
markers =
    smoke: critical user journeys suitable for a quick confidence check
    regression: broader functional coverage
    no_auth: start the test with an unauthenticated browser context
