parameters:
  - name: useSelfHosted
    type: boolean
    default: false
  - name: selfHostedPool
    type: string
    default: Default
  - name: vmImage
    type: string
    default: ubuntu-latest

trigger:
  - '*'

pr:
  - '*'

pool:
  ${{ if eq(parameters.useSelfHosted, true) }}:
    name: ${{ parameters.selfHostedPool }}
  ${{ else }}:
    vmImage: ${{ parameters.vmImage }}

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.13'
      addToPath: true
    displayName: Select Python

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
    displayName: Install Python dependencies

  - script: python -m playwright install --with-deps chromium
    displayName: Install Playwright browser

  - script: bash run_tests.sh
    displayName: Run UI tests
    env:
      SAUCE_BASE_URL: https://www.saucedemo.com
      SAUCE_USERNAME: $(SAUCE_USERNAME)
      SAUCE_PASSWORD: $(SAUCE_PASSWORD)

  - task: PublishTestResults@2
    displayName: Publish JUnit results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: reports/junit.xml
      failTaskOnFailedTests: true
      testRunTitle: Sauce Demo Playwright UI tests

  - task: PublishPipelineArtifact@1
    displayName: Publish HTML report
    condition: succeededOrFailed()
    inputs:
      targetPath: reports
      artifact: playwright-report

  - task: PublishPipelineArtifact@1
    displayName: Publish failure artifacts
    condition: succeededOrFailed()
    inputs:
      targetPath: test-results
      artifact: playwright-failure-artifacts
